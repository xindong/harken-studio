name: Slack Notify

on:
  pull_request_target:
    types: [closed]
  issues:
    types: [opened]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event_name == 'issues' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check notify card renderer
        run: python .scripts/tests/test_slack_notify.py -v

      - name: Post notice to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0BLA6ALY6N
          GH_SLACK_MAP: ${{ vars.GH_SLACK_MAP }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SENDER: ${{ github.event.sender.login }}
        run: python .scripts/slack_notify.py
