name: PR Gate Integration

# Not a required status check (path-filtered workflows must not be).

on:
  pull_request:
    paths:
      - 'HarkenIntegration/**'
      - 'HarkenEngine/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  workflow_dispatch:

concurrency:
  group: pr-gate-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # BuildInfo build type is inferred from GITHUB_ACTIONS; gate builds use dev.
  HARKEN_BUILD_CHANNEL: dev

jobs:
  integration-windows:
    name: integration-windows
    runs-on: [self-hosted, windows, harken-win]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      # clean:false — the self-hosted workspace is persistent, and the default
      # clean runs `git clean -ffdx`, whose -x deletes the gitignored
      # build-integration-runtime-clang/ tree. Without this every run is a cold build and
      # self-hosting buys nothing but the core count.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Check Integration source contracts before compilation
        run: |
          python .scripts/check_integration_version.py
          python HarkenIntegration/Test/Package/check_unity_integration_contract.py
          python HarkenIntegration/Test/Package/test_check_unity_integration_contract.py -v

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure Engine libraries (windows-release)
        run: >-
          cmake --fresh --preset windows-release -B build-integration-runtime-clang
          -DHARKEN_BUILD_ENGINE=ON
          -DHARKEN_BUILD_ENGINE_DEV=ON

      # No --parallel: bare --parallel means ninja's own default (cores + 2) and
      # takes precedence over CMAKE_BUILD_PARALLEL_LEVEL, which each runner's
      # .env sets so three concurrent jobs share the machine instead of each
      # claiming all of it.
      - name: Build Engine editions
        run: cmake --build build-integration-runtime-clang --config Release --target harken_engine

      - name: Install Engine
        run: cmake --install build-integration-runtime-clang --config Release --prefix .temp/engine-install

      - name: Check generated binding against the installed ABI manifest
        env:
          HARKEN_ABI_MANIFEST: ${{ github.workspace }}/.temp/engine-install/share/HarkenEngine/harken_abi_manifest.json
        run: |
          python HarkenIntegration/Unity/Binding/generate_binding.py --manifest "$HARKEN_ABI_MANIFEST" --check
          python HarkenIntegration/Test/Binding/test_binding_policy.py

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Run contract gates against native library (binding, metadata version and zero-GC hot path)
        timeout-minutes: 5
        env:
          HARKEN_NATIVE_DIR: ${{ github.workspace }}/.temp/engine-install/bin
        run: >-
          dotnet run --project HarkenIntegration/Test/ContractTest --configuration Release --
          --require-native

  integration-macos:
    name: integration-macos-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            slug: x64
            runner: macos-26-intel
          - arch: arm64
            slug: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check Integration version identity
        run: python3 .scripts/check_integration_version.py

      - name: Check Unity Integration source contract
        run: python3 HarkenIntegration/Test/Package/check_unity_integration_contract.py

      - name: Test Unity Integration source contract
        run: python3 HarkenIntegration/Test/Package/test_check_unity_integration_contract.py -v

      - name: Install macOS build deps
        run: brew install ninja

      - name: Configure Engine libraries (macos-release, ${{ matrix.arch }})
        run: >-
          cmake --fresh --preset macos-release -B build-integration-runtime-clang
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DHARKEN_BUILD_ENGINE=ON
          -DHARKEN_BUILD_ENGINE_DEV=ON

      - name: Build Engine editions
        run: cmake --build build-integration-runtime-clang --config Release --target harken_engine

      - name: Install Engine
        run: cmake --install build-integration-runtime-clang --config Release --prefix .temp/engine-install

      - name: Check generated binding against the installed ABI manifest
        run: python3 HarkenIntegration/Unity/Binding/generate_binding.py --manifest .temp/engine-install/share/HarkenEngine/harken_abi_manifest.json --check

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Run contract gates against native library (binding, metadata version and zero-GC hot path)
        timeout-minutes: 5
        env:
          HARKEN_NATIVE_DIR: ${{ github.workspace }}/.temp/engine-install/lib
        run: >-
          dotnet run --project HarkenIntegration/Test/ContractTest --configuration Release --
          --require-native
