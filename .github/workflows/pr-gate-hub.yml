name: PR Gate Hub
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-index-diagnosis-${{ github.ref }}
  cancel-in-progress: false
env:
  HARKEN_BUILD_CHANNEL: dev
jobs:
  index-trace:
    name: index-trace-${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, windows, harken-win]
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: false
      - name: Setup MSVC environment
        if: runner.name == 'harken-win-2'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Configure and build unchanged PR tests
        if: runner.name == 'harken-win-2'
        shell: powershell
        run: |
          cmake --fresh --preset windows-release -B build-hub -DHARKEN_BUILD_HUB=ON -DHARKEN_BUILD_HUB_UNIT_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-hub --config Release --target harken_hub_tests
          exit $LASTEXITCODE
      - name: Start file trace on failing runner
        if: runner.name == 'harken-win-2'
        shell: powershell
        run: |
          $evidence = Join-Path $PWD ".temp/index-trace-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Get-Process | Select-Object Id,ProcessName | ConvertTo-Json | Set-Content (Join-Path $evidence 'processes.json')
          logman start "HubIndex-$env:GITHUB_RUN_ID" -p Microsoft-Windows-Kernel-File 0x1ff0 4 -o (Join-Path $evidence 'files.etl') -ets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content (Join-Path $evidence 'trace-started') 'yes'
      - name: Capture install failures without changing behavior
        if: runner.name == 'harken-win-2'
        shell: python
        run: |
          import datetime, json, os, pathlib, subprocess, time
          root = pathlib.Path.cwd()
          evidence = root / '.temp' / ('index-trace-' + os.environ['GITHUB_RUN_ID'])
          env = os.environ.copy()
          env['PATH'] = str(pathlib.Path(env['VENUS_QT_DIR']) / 'bin') + os.pathsep + env['PATH']
          env['QT_QPA_PLATFORM'] = 'offscreen'
          started = time.monotonic()
          records = []
          for index in range(200):
              command = [str(root / 'build-hub/bin/Release/harken_hub_tests.exe'),
                         '--gtest_filter=InstallExecutorTest.*', '--gtest_fail_fast=1', '--gtest_color=no',
                         '--gtest_output=json:' + str(evidence / f'{index:04d}.gtest.json')]
              with subprocess.Popen(command, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT) as process:
                  at = datetime.datetime.now(datetime.timezone.utc).isoformat()
                  try:
                      output, _ = process.communicate(timeout=25)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      output, _ = process.communicate()
                  code = process.returncode
                  records.append({'iteration': index, 'pid': process.pid, 'started': at, 'exit_code': code, 'elapsed': time.monotonic() - started})
              (evidence / f'{index:04d}.log').write_bytes(output)
              if code:
                  print(output.decode('utf-8', errors='replace'), flush=True)
                  break
              if time.monotonic() - started > 30:
                  break
          summary = {'runner': os.environ['RUNNER_NAME'], 'machine': os.environ.get('COMPUTERNAME'),
                     'head': os.environ['GITHUB_SHA'], 'production_head': '6868a71858b30b77730226553e83d447d5b89563', 'records': records}
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          raise SystemExit(1 if records[-1]['exit_code'] else 0)
      - name: Stop trace
        if: always() && runner.name == 'harken-win-2'
        shell: powershell
        run: |
          $evidence = Join-Path $PWD ".temp/index-trace-$env:GITHUB_RUN_ID"
          if (Test-Path (Join-Path $evidence 'trace-started')) {
            logman stop "HubIndex-$env:GITHUB_RUN_ID" -ets
            tracerpt (Join-Path $evidence 'files.etl') -of XML -o (Join-Path $evidence 'files.xml') -y
          }
      - name: Extract index events and native operation results
        if: always() && runner.name == 'harken-win-2'
        shell: python
        run: |
          import json, os, pathlib, xml.etree.ElementTree as ET
          evidence = pathlib.Path('.temp') / ('index-trace-' + os.environ['GITHUB_RUN_ID'])
          path = evidence / 'files.xml'
          if not path.exists():
              raise SystemExit(1)
          ns = {'e': 'http://schemas.microsoft.com/win/2004/08/events/event'}
          objects, irps, count = {}, {}, 0
          with (evidence / 'index-events.jsonl').open('w', encoding='utf-8') as output:
              for _, event in ET.iterparse(path, events=('end',)):
                  if event.tag.rsplit('}', 1)[-1] != 'Event':
                      continue
                  fields = {n.attrib['Name']: n.text or '' for n in event.findall('e:EventData/e:Data', ns)}
                  task_node = event.find('e:RenderingInfo/e:Task', ns)
                  task = task_node.text if task_node is not None else ''
                  obj, irp = fields.get('FileObject'), fields.get('Irp')
                  name = fields.get('FileName', fields.get('FilePath', ''))
                  if obj and name:
                      objects.pop(obj, None)
                      if 'install-index.json' in name:
                          objects[obj] = name
                  resolved = name if 'install-index.json' in name else objects.get(obj, irps.get(irp, ''))
                  if resolved:
                      if irp:
                          irps[irp] = resolved
                      execution = event.find('e:System/e:Execution', ns)
                      timestamp = event.find('e:System/e:TimeCreated', ns)
                      output.write(json.dumps({'pid': int(execution.attrib['ProcessID']), 'tid': int(execution.attrib['ThreadID']),
                          'time': timestamp.attrib['SystemTime'], 'task': task, 'path': resolved, 'data': fields}) + '\n')
                      count += 1
                  if task == 'Close' and obj:
                      objects.pop(obj, None)
                  if task == 'OperationEnd' and irp:
                      irps.pop(irp, None)
                  event.clear()
          print(f'Captured {count} index events')
      - name: Upload targeted evidence
        if: always() && runner.name == 'harken-win-2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hub-index-trace-${{ github.run_id }}
          path: |
            .temp/index-trace-${{ github.run_id }}/*.log
            .temp/index-trace-${{ github.run_id }}/*.json
            .temp/index-trace-${{ github.run_id }}/*.jsonl
          retention-days: 14
