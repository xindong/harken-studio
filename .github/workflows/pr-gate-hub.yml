name: PR Gate Hub
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-51-diagnosis-${{ github.ref }}
  cancel-in-progress: false
env:
  HARKEN_BUILD_CHANNEL: dev
jobs:
  hub-windows:
    name: issue-51-windows-${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, windows, harken-win]
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: false
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Configure Hub tests
        run: >-
          cmake --fresh --preset windows-release -B build-hub
          -DHARKEN_BUILD_HUB=ON -DHARKEN_BUILD_HUB_UNIT_TESTS=ON
      - name: Build diagnostic tests
        run: cmake --build build-hub --config Release --target harken_hub_tests
      - name: Record filesystem environment
        shell: powershell
        continue-on-error: true
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | ConvertTo-Json
          Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,IoavProtectionEnabled | ConvertTo-Json
          Get-CimInstance -Namespace root/SecurityCenter2 -ClassName AntivirusProduct | Select-Object displayName | ConvertTo-Json
      - name: Start filesystem trace on original runner
        if: runner.name == 'harken-win-1'
        shell: powershell
        continue-on-error: true
        run: |
          $evidence = Join-Path $PWD ".temp/issue-51-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Get-Process | Select-Object Id,ProcessName | ConvertTo-Json | Set-Content (Join-Path $evidence 'processes.json')
          logman start "Issue51-$env:GITHUB_RUN_ID" -p Microsoft-Windows-Kernel-File 0x1ff0 4 -o (Join-Path $evidence 'files.etl') -ets
          if ($LASTEXITCODE -eq 0) { Set-Content (Join-Path $evidence 'trace-started') 'yes' }
      - name: Capture recovery failures across fresh processes
        shell: python
        run: |
          import json, os, pathlib, subprocess, time
          root = pathlib.Path.cwd()
          evidence = root / '.temp' / ('issue-51-' + os.environ['GITHUB_RUN_ID'])
          evidence.mkdir(parents=True, exist_ok=True)
          if os.environ['RUNNER_NAME'] != 'harken-win-1':
              raise SystemExit(0)
          env = os.environ.copy()
          env['PATH'] = str(pathlib.Path(env['VENUS_QT_DIR']) / 'bin') + os.pathsep + env['PATH']
          env['QT_QPA_PLATFORM'] = 'offscreen'
          started = time.monotonic()
          records = []
          for index in range(200):
              command = [str(root / 'build-hub/bin/Release/harken_hub_tests.exe'),
                         '--gtest_filter=UpdateRecoveryTest/0.*', '--gtest_fail_fast=1', '--gtest_color=no',
                         '--gtest_output=json:' + str(evidence / f'{index:04d}.gtest.json')]
              try:
                  result = subprocess.run(command, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=25)
                  code, output = result.returncode, result.stdout
              except subprocess.TimeoutExpired as error:
                  code, output = 124, error.stdout or b''
              (evidence / f'{index:04d}.log').write_bytes(output)
              records.append({'iteration': index, 'exit_code': code, 'elapsed': time.monotonic() - started})
              if code:
                  print(output.decode('utf-8', errors='replace'), flush=True)
                  break
              if (index + 1) % 25 == 0:
                  print(f'{index + 1} fresh processes recorded', flush=True)
              if time.monotonic() - started > 45:
                  break
          summary = {'runner': os.environ['RUNNER_NAME'], 'machine': os.environ.get('COMPUTERNAME'),
                     'head': os.environ['GITHUB_SHA'], 'records': records}
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          raise SystemExit(1 if records[-1]['exit_code'] else 0)
      - name: Stop filesystem trace
        if: always() && runner.name == 'harken-win-1'
        shell: powershell
        run: |
          $evidence = Join-Path $PWD ".temp/issue-51-$env:GITHUB_RUN_ID"
          if (Test-Path (Join-Path $evidence 'trace-started')) {
            logman stop "Issue51-$env:GITHUB_RUN_ID" -ets
            tracerpt (Join-Path $evidence 'files.etl') -of XML -o (Join-Path $evidence 'files.xml') -y
          }
      - name: Extract state file events
        if: always() && runner.name == 'harken-win-1'
        shell: python
        run: |
          import json, os, pathlib, xml.etree.ElementTree as ET
          evidence = pathlib.Path('.temp') / ('issue-51-' + os.environ['GITHUB_RUN_ID'])
          path = evidence / 'files.xml'
          if not path.exists():
              raise SystemExit(0)
          keys, selected = set(), []
          for _, event in ET.iterparse(path, events=('end',)):
              if event.tag.rsplit('}', 1)[-1] != 'Event':
                  continue
              fields = {node.attrib.get('Name', ''): node.text or '' for node in event.iter() if node.tag.rsplit('}', 1)[-1] == 'Data'}
              identifiers = [value for key, value in fields.items() if key in ('FileObject', 'FileKey') and value not in ('', '0', '0x0')]
              relevant = any('update-state.json' in value for value in fields.values())
              if relevant:
                  keys.update(identifiers)
              if relevant or any(value in keys for value in identifiers):
                  selected.append(ET.tostring(event, encoding='unicode'))
              event.clear()
          (evidence / 'state-file-events.json').write_text(json.dumps(selected, indent=2), encoding='utf-8')
          print(f'Recorded {len(selected)} state-file events')
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-51-${{ github.run_id }}-${{ matrix.slot }}-${{ runner.name }}
          path: |
            .temp/issue-51-${{ github.run_id }}/*.log
            .temp/issue-51-${{ github.run_id }}/*.json
          retention-days: 14
