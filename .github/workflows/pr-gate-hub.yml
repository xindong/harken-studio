name: PR Gate Hub
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-51-fix-validation
  cancel-in-progress: false
env:
  HARKEN_BUILD_CHANNEL: dev
jobs:
  hub-windows:
    name: issue-51-fixed-${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, windows, harken-win]
    timeout-minutes: 15
    steps:
      - name: Checkout production fix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 00fe11363a5b47bed3c5e3a229551aabdec6610b
          fetch-depth: 0
          clean: false
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Configure Hub tests
        run: >-
          cmake --fresh --preset windows-release -B build-hub
          -DHARKEN_BUILD_HUB=ON -DHARKEN_BUILD_HUB_UNIT_TESTS=ON
      - name: Build tests
        run: cmake --build build-hub --config Release --target harken_hub_tests
      - name: Repeat recovery across fresh processes
        shell: python
        run: |
          import json, os, pathlib, subprocess, time
          root = pathlib.Path.cwd()
          evidence = root / '.temp' / ('issue-51-fix-' + os.environ['GITHUB_RUN_ID'])
          evidence.mkdir(parents=True, exist_ok=True)
          env = os.environ.copy()
          env['PATH'] = str(pathlib.Path(env['VENUS_QT_DIR']) / 'bin') + os.pathsep + env['PATH']
          env['QT_QPA_PLATFORM'] = 'offscreen'
          binary = str(root / 'build-hub/bin/Release/harken_hub_tests.exe')
          records = []
          for index in range(200):
              started = time.monotonic()
              command = [binary, '--gtest_filter=UpdateRecoveryTest/*.*', '--gtest_fail_fast=1', '--gtest_color=no']
              try:
                  result = subprocess.run(command, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30)
                  code, output = result.returncode, result.stdout
              except subprocess.TimeoutExpired as error:
                  code, output = 124, error.stdout or b''
              (evidence / f'{index:04d}.log').write_bytes(output)
              records.append({'iteration': index, 'exit_code': code, 'seconds': time.monotonic() - started,
                              'commit_retries': output.count(b'Retrying update state commit:'),
                              'commit_failures': output.count(b'Cannot commit update state:')})
              if code:
                  print(output.decode('utf-8', errors='replace'), flush=True)
                  break
              if (index + 1) % 25 == 0:
                  print(f'{index + 1} fresh processes passed', flush=True)
          summary = {'runner': os.environ['RUNNER_NAME'], 'machine': os.environ.get('COMPUTERNAME'),
                     'head': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                     'records': records}
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          raise SystemExit(1 if records[-1]['exit_code'] else 0)
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-51-fixed-${{ github.run_id }}-${{ matrix.slot }}-${{ runner.name }}
          path: .temp/issue-51-fix-${{ github.run_id }}/
          include-hidden-files: true
          retention-days: 14
